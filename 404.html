<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, follow" />
  <title>Page not found — Viscous UI</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      background: #0a0a0a; color: #f4f4f4;
      font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
    }
    main { width: min(560px, 100%); }
    .eyebrow { margin: 0 0 18px; font: 500 12px/1 ui-monospace, monospace; letter-spacing: .08em; text-transform: uppercase; color: #808080; }
    h1 { margin: 0; font-size: clamp(44px, 9vw, 76px); line-height: .95; letter-spacing: -.055em; }
    p { margin: 22px 0 0; max-width: 42ch; font-size: 16px; line-height: 1.6; color: #9a9a9a; }
    .mark { display: flex; align-items: center; gap: 12px; margin-bottom: 48px; font-weight: 600; letter-spacing: -.02em; }
    .mark svg { width: 30px; height: 30px; }
    a { color: #f4f4f4; text-underline-offset: 3px; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 34px; }
    .btn {
      display: inline-flex; align-items: center; height: 44px; padding: 0 20px; border-radius: 999px;
      background: #f4f4f4; color: #0a0a0a; text-decoration: none; font-size: 14px; font-weight: 500;
    }
    .btn--ghost { background: transparent; color: #f4f4f4; border: 1px solid rgba(255,255,255,.18); }
    :focus-visible { outline: 2px solid #f4f4f4; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="mark">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="12" cy="16" r="9" fill="#f4f4f4"/><circle cx="23" cy="12" r="6" fill="#f4f4f4"/></svg>
      <span>Viscous<span style="color:#808080">/ui</span></span>
    </div>
    <p class="eyebrow">404 — nothing here</p>
    <h1>This page slipped<br />through the filter.</h1>
    <p>The address doesn’t exist, or it moved. The component gallery is still flowing as usual.</p>
    <div class="actions">
      <a class="btn" href="/viscous-ui/">Back to the gallery</a>
      <a class="btn btn--ghost" href="https://github.com/0dvsh0/viscous-ui">View on GitHub</a>
    </div>
  </main>
</body>
</html>
